; JM-01 firmware - Waveshare ESP32-S3-LCD-1.28 (non-touch)
; Build:   pio run
; Flash:   pio run -t upload        (USB-C, the CH343 port)
; Logs:    pio device monitor

[env:jm01]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R2: 16 MB flash, 2 MB quad PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv   ; two 6.25 MB app slots for over-the-air updates
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0         ; logs go through the CH343 USB-UART chip, not native USB
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -Iinclude
  -Os

lib_deps =
  lvgl/lvgl@9.2.2
  lovyan03/LovyanGFX@1.1.16
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
